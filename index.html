<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金庸群侠传 - 文字版(增强版)</title>
    <link rel="stylesheet" href="./style.css">
    <!-- Prevent browser requesting /favicon.ico and logging 404 by providing an empty data URI favicon -->
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="container">
        <h1>金庸群侠传</h1>

        <!-- 角色简历面板 -->
        <div class="char-panel" id="char-panel">
            <div class="char-panel-left">
                <div class="avatar" id="char-avatar">🗡️</div>
                <div class="char-name" id="char-name">未创建</div>
                <div class="char-school" id="char-school">--</div>
                <div class="char-date" id="char-date">金元--年--月--日</div>
            </div>
            <div class="char-panel-right">
                <div class="attr-row"><span>等级</span><span id="char-level">1</span></div>
                <div class="attr-row"><span>经验</span><span id="char-exp">0</span>/<span id="char-max-exp">100</span>
                </div>
                <div class="attr-row"><span>气血</span><span id="char-hp">100</span>/<span id="char-max-hp">100</span>
                </div>
                <div class="attr-row"><span>内力</span><span id="char-mp">50</span>/<span id="char-max-mp">50</span></div>
                <div class="attr-row"><span>攻击</span><span id="char-atk">10</span></div>
                <div class="attr-row"><span>防御</span><span id="char-def">5</span></div>
                <div class="attr-row"><span>银两</span><span id="char-money">0</span></div>
            </div>
            <div class="char-panel-actions">
                <button class="btn-small" onclick="openBagModal()">物品栏</button>
                <button class="btn-small" onclick="saveGame()">存档</button>
            </div>
        </div>

        <!-- 音效控制 -->
        <div class="sound-control">
            <span>音效：</span>
            <button id="btn-sound" onclick="toggleSound()">🔊 开</button>
            <span>音量：</span>
            <input type="range" id="volume" min="0" max="100" value="70" oninput="setVolume(this.value)">
            <span>BGM：</span>
            <button id="btn-bgm" onclick="toggleBgm()">🎵 开</button>
            <button onclick="document.getElementById('bgm-file').click()">📁选曲</button>
            <input type="file" id="bgm-file" accept="audio/*" style="display:none" onchange="loadBgmFile(event)">
            <span id="bgm-name" style="font-size:0.85rem;color:#666;"></span>
        </div>

        <!-- 游戏主面板 -->
        <div class="game-panel">
            <div class="scene-area" id="scene-area">
                <div class="scene-title" id="scene-title">欢迎来到金庸群侠传</div>
                <div class="scene-desc" id="scene-desc">你是一位初入江湖的少侠，怀揣着武侠梦，即将开启一段传奇之旅。请先创建你的角色，开始这段江湖冒��[...]</div>
                <ul class="options-list" id="options-list">
                    <li onclick="openCreateCharModal()">创建角色</li>
                </ul>
            </div>
            <!-- 日志区域 -->
            <div class="log-area" id="log-area">
                <div class="log-item system">系统：欢迎来到金庸群侠传文字版！</div>
            </div>
        </div>
    </div>

    <!-- 角色创建弹窗 -->
    <div class="modal" id="create-char-modal">
        <div class="modal-content">
            <div class="modal-title">创建角色</div>
            <div class="form-group">
                <label for="char-name-input">角色姓名：</label>
                <input type="text" id="char-name-input" placeholder="请输入你的江湖名号">
            </div>
            <div class="form-group">
                <label for="char-school-select">选择门派：</label>
                <select id="char-school-select">
                    <option value="少林">少林（气血深厚，金刚不坏）</option>
                    <option value="武当">武当（太极剑法，内力绵长）</option>
                    <option value="丐帮">丐帮（降龙十八掌，刚猛无俦）</option>
                    <option value="华山">华山（独孤九剑，灵动无招）</option>
                    <option value="全真">全真（天罡北斗，道家心法）</option>
                    <option value="桃花岛">桃花岛（落英神剑，身法出众）</option>
                </select>
            </div>
            <button class="btn" onclick="createCharacter()">确认创建</button>
            <button class="btn btn-cancel" onclick="closeCreateCharModal()">取消</button>
        </div>
    </div>

    <!-- 物品栏弹窗 -->
    <div class="modal" id="bag-modal">
        <div class="modal-content">
            <div class="modal-title">物品 & 武学</div>
            <div id="bag-content"></div>
            <button class="btn btn-cancel" onclick="closeBagModal()">关闭</button>
        </div>
    </div>

    <!-- 商店弹窗 -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <div class="modal-title">杂货铺</div>
            <div class="shop-list" id="shop-list"></div>
            <div style="text-align:center;margin-top:15px;">
                <button class="btn btn-cancel" onclick="closeShopModal()">离开杂货铺</button>
            </div>
        </div>
    </div>

    <!-- 战斗弹窗 -->
    <div class="modal" id="fight-modal">
        <div class="modal-content">
            <div class="modal-title" id="fight-title">战斗中</div>
            <div id="fight-info"></div>
            <div class="fight-options">
                <button class="btn" onclick="playerAttack()">普通攻击</button>
                <button class="btn" onclick="useSkill()">使用武学</button>
                <button class="btn" onclick="useItemInFight()">使用物品</button>
                <button class="btn btn-cancel" onclick="fleeFight()">逃跑</button>
            </div>
        </div>
    </div>

    <script src="./game.js"></script>
</body>

</html>
