<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金庸群侠传 - 文字版(增强版)</title>
    <link rel="stylesheet" href="./style.css?v=1.0.0">
    <!-- Prevent browser requesting /favicon.ico and logging 404 by providing an empty data URI favicon -->
    <link rel="icon" href="data:,">
</head>

<body>
    <div class="container">
        <h1>金庸群侠传</h1>

        <!-- 角色简历面板 -->
        <div class="char-panel" id="char-panel">
            <div class="char-header">
                <div class="avatar" id="char-avatar">🗡️</div>
                <div class="char-basic">
                    <div class="char-name-row">
                        <span class="char-name" id="char-name">未创建</span>
                        <span class="char-sep">·</span>
                        <span class="char-school" id="char-school">--</span>
                        <span class="char-sep">·</span>
                        <span class="char-date" id="char-date">金元--年--月--日</span>
                    </div>
                </div>
                <div class="char-panel-actions">
                    <div class="dropdown">
                        <button class="btn-small dropdown-toggle" onclick="toggleMenu()">☰ 菜单</button>
                        <div class="dropdown-menu" id="top-menu">
                            <div class="dropdown-item" onclick="openBagModal();closeMenu();">物品</div>
                            <div class="dropdown-item" onclick="openAudioModal();closeMenu();">音效/音乐</div>
                            <div class="dropdown-item" onclick="openQuestModal();closeMenu();">任务</div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item" onclick="saveGame();closeMenu();">存档</div>
                            <div class="dropdown-item" onclick="loadGame();closeMenu();">读档</div>
                            <div class="dropdown-item dropdown-danger" onclick="newGame();closeMenu();">新游戏</div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item" style="color:#888;font-size:0.8rem;cursor:default;"
                                id="menu-version">v1.0.0</div>
                            <div class="dropdown-item" onclick="checkForUpdates(true);closeMenu();"
                                style="color:#4a90d9;font-size:0.85rem;">🔍 检查更新</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="char-stats-card">
                <div class="char-level-row">
                    <span class="char-level-label">Lv.<span id="char-level">1</span></span>
                    <span class="char-exp-text">经验 <span id="char-exp">0</span>/<span
                            id="char-max-exp">100</span></span>
                </div>
                <div class="char-body-row">
                    <div class="char-bars">
                        <div class="char-bar-item">
                            <div class="char-bar-label">气血 <span id="char-hp">100</span>/<span
                                    id="char-max-hp">100</span></div>
                            <div class="char-bar-bg">
                                <div class="char-bar-fill char-bar-hp" id="char-hp-bar"></div>
                            </div>
                        </div>
                        <div class="char-bar-item">
                            <div class="char-bar-label">内力 <span id="char-mp">50</span>/<span id="char-max-mp">50</span>
                            </div>
                            <div class="char-bar-bg">
                                <div class="char-bar-fill char-bar-mp" id="char-mp-bar"></div>
                            </div>
                        </div>
                    </div>
                    <div class="char-attr-row">
                        <div class="char-attr-item"><span class="attr-key">攻击</span> <span id="char-atk">10</span></div>
                        <div class="char-attr-item"><span class="attr-key">防御</span> <span id="char-def">5</span></div>
                        <div class="char-attr-item"><span class="attr-key">银两</span> <span id="char-money">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 音效控制（已移至菜单弹窗） -->

        <!-- 游戏主面板 -->
        <div class="game-panel">
            <div class="scene-area" id="scene-area">
                <div class="scene-title" id="scene-title">欢迎来到金庸群侠传</div>
                <div class="scene-desc" id="scene-desc">你是一位初入江湖的少侠，怀揣着武侠梦，即将开启一段传奇之旅。请先创建你的角色，开始这段江湖冒��[...]</div>
                <ul class="options-list" id="options-list">
                    <li onclick="openCreateCharModal()">创建角色</li>
                </ul>
            </div>
            <!-- 日志区域 -->
            <div class="log-area" id="log-area">
                <div class="log-item system">系统：欢迎来到金庸群侠传文字版！</div>
            </div>
        </div>
    </div>

    <!-- 角色创建弹窗 -->
    <div class="modal" id="create-char-modal">
        <div class="modal-content">
            <div class="modal-title">创建角色</div>
            <div class="form-group">
                <label for="char-name-input">角色姓名：</label>
                <input type="text" id="char-name-input" placeholder="请输入你的江湖名号">
            </div>
            <div class="form-group">
                <label for="char-school-select">选择门派：</label>
                <select id="char-school-select">
                    <option value="少林">少林（气血深厚，金刚不坏）</option>
                    <option value="武当">武当（太极剑法，内力绵长）</option>
                    <option value="丐帮">丐帮（降龙十八掌，刚猛无俦）</option>
                    <option value="华山">华山（独孤九剑，灵动无招）</option>
                    <option value="全真">全真（天罡北斗，道家心法）</option>
                    <option value="桃花岛">桃花岛（落英神剑，身法出众）</option>
                </select>
            </div>
            <button class="btn" onclick="createCharacter()">确认创建</button>
            <button class="btn btn-cancel" onclick="closeCreateCharModal()">取消</button>
        </div>
    </div>

    <!-- 物品栏弹窗 -->
    <div class="modal" id="bag-modal">
        <div class="modal-content">
            <div class="modal-title">物品 & 武学</div>
            <div id="bag-content"></div>
            <button class="btn btn-cancel" onclick="closeBagModal()">关闭</button>
        </div>
    </div>

    <!-- 商店弹窗 -->
    <div class="modal" id="shop-modal">
        <div class="modal-content">
            <div class="modal-title">杂货铺</div>
            <div class="shop-list" id="shop-list"></div>
            <div style="text-align:center;margin-top:15px;">
                <button class="btn btn-cancel" onclick="closeShopModal()">离开杂货铺</button>
            </div>
        </div>
    </div>

    <!-- 音效弹窗 -->
    <div class="modal" id="audio-modal">
        <div class="modal-content">
            <div class="modal-title">音效 / 音乐</div>
            <div style="padding:10px 0;">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
                    <span>音效：</span>
                    <button id="btn-sound" onclick="toggleSound()">🔊 开</button>
                </div>
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
                    <span>音量：</span>
                    <input type="range" id="volume" min="0" max="100" value="70" oninput="setVolume(this.value)"
                        style="flex:1;max-width:200px;">
                    <span id="volume-val">70</span>
                </div>
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
                    <span>BGM：</span>
                    <button id="btn-bgm" onclick="toggleBgm()">🎵 开</button>
                    <button onclick="document.getElementById('bgm-file').click()">📁选曲</button>
                    <input type="file" id="bgm-file" accept="audio/*" style="display:none"
                        onchange="loadBgmFile(event)">
                </div>
                <div style="color:#666;font-size:0.85rem;" id="bgm-name"></div>
            </div>
            <div style="text-align:center;margin-top:15px;">
                <button class="btn btn-cancel" onclick="closeAudioModal()">关闭</button>
            </div>
        </div>
    </div>
    <!-- 任务弹窗 -->
    <div class="modal" id="quest-modal">
        <div class="modal-content">
            <div class="modal-title">江湖任务</div>
            <div class="quest-tabs">
                <div class="quest-tab active" id="quest-tab-main" onclick="switchQuestTab('main')">主线任务</div>
                <div class="quest-tab" id="quest-tab-side" onclick="switchQuestTab('side')">支线任务</div>
            </div>
            <div class="quest-list" id="quest-main-list"></div>
            <div class="quest-list" id="quest-side-list" style="display:none;"></div>
            <div style="text-align:center;margin-top:15px;">
                <button class="btn btn-cancel" onclick="closeQuestModal()">关闭</button>
            </div>
        </div>
    </div>
    <!-- 战斗弹窗 -->
    <div class="modal" id="fight-modal">
        <div class="modal-content">
            <div class="modal-title" id="fight-title">战斗中</div>
            <div id="fight-info"></div>
            <div class="fight-options">
                <button class="btn" onclick="playerAttack()">普通攻击</button>
                <button class="btn" onclick="useSkill()">使用武学</button>
                <button class="btn" onclick="useItemInFight()">使用物品</button>
                <button class="btn btn-cancel" onclick="fleeFight()">逃跑</button>
            </div>
        </div>
    </div>

    <!-- 更新通知栏 -->
    <div id="update-banner" style="display:none;">
        <span>📢 发现新版本 <strong id="new-version"></strong>，建议刷新页面获取更新</span>
        <button class="btn" onclick="safeReload()" style="margin-left:10px;">立即刷新</button>
        <button class="btn btn-cancel" onclick="dismissUpdateBanner()">稍后</button>
    </div>

    <script src="./game.js?v=1.0.3"></script>
</body>

</html>
